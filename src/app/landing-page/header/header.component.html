<header id="home">
  <div class="custom-container">
    <div class="row">
      <div class="col-12">
        <div class="landing-header" [class.fixed]="isFixed">
          <div class="main-menu">
            <nav class="navbar navbar-expand-sm navbar-light">
              <a class="navbar-brand">
                <div class="logo-block" routerLink="/messenger">
                  <img class="img-fluid" src="assets/images/logo/landing-logo.png" alt="logo" />
                </div>
              </a>
              <button class="navbar-toggler d-xl-none" type="button" (click)="showMenu()">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse d-xl-block" [class.show]="open" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item active">
                    <a class="nav-link" routerLink="/messenger">Messenger <span class="sr-only">(current)</span></a>
                  </li>
                  @for (item of menuItems; track item) {
                  <li class="nav-item" (click)="toggle(item)">
                    <a class="nav-link dropdown-toggle" [class.show]="item.show">{{ item.label }}</a>
                    <ul class="dropdown-menu" [class.show]="item.show">
                      <ng-container *ngComponentOutlet="item.component"></ng-container>
                    </ul>
                  </li>
                  }
                </ul>
              </div>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
