<div class="login-page1">
  <div class="container-fluid p-0">
    <div class="row">
      <div class="col-12">
        <div class="login-contain-main">
          <div class="left-page">
            <div class="login-content">
              <div class="login-content-header"><img class="image-fluid" src="assets/images/logo/landing-logo.png"
                  alt="images"></div>
              <h3>Hello Everyone , We are Chitchat</h3>
              <h4>Wellcome to chitchat please Register to your account.</h4>
              <form class="form1">
                <div class="form-group">
                  <label class="col-form-label">User name</label>
                  <input class="form-control" type="text" name="firstName" placeholder="Abc" fdprocessedid="egk6ze">
                </div>
                <div class="form-group">
                  <label class="col-form-label" for="inputEmail3">Email Address</label>
                  <input class="form-control" id="inputEmail3" type="email" placeholder="Demo@123gmail.com">
                </div>
                <div class="form-group">
                  <label class="col-form-label" for="inputPassword3">Password</label><span> </span>
                  <input class="form-control" [type]="show ? 'text' : 'password'" id="inputPassword3" type="password"
                    placeholder="Password" required="">
                  @if (show) {
                  <div class="show-hide" (click)="showPassword()">
                    <span class="Hide"></span>
                  </div>
                  } @else {
                  <div class="show-hide" (click)="showPassword()">
                    <span class="show"></span>
                  </div>
                  }
                </div>
                <div class="form-group">
                  <div class="rememberchk">
                    <input class="form-check-input" id="gridCheck1" type="checkbox">
                    <label class="form-check-label ps-4" for="gridCheck1">Remember Me.</label>
                    <h6 class="pull-right">Forgot Password?</h6>
                  </div>
                </div>
                <div class="form-group">
                  <div class="buttons">
                    <a class="btn btn-primary button-effect" href="pages/signup">SignUp</a>
                    <a class="btn button-effect btn-signup" href="pages/login">Login</a>
                  </div>
                </div>
              </form>
              <div class="line">
                <h6>OR Connect with</h6>
              </div>
              <div class="medialogo">
                <ul>
                  <li><a class="icon-btn btn-danger button-effect"><app-feather-icons
                        [icon]="'google'"></app-feather-icons></a></li>
                  <li><a class="icon-btn btn-primary button-effect"><app-feather-icons
                        [icon]="'twitter'"></app-feather-icons></a></li>
                  <li><a class="icon-btn btn-facebook button-effect"><app-feather-icons
                        [icon]="'facebook-f'"></app-feather-icons></a></li>
                </ul>
              </div>
              <div class="termscondition">
                <h4 class="mb-0"><span>*</span>Terms and condition<b>&amp;</b>Privacy policy</h4>
              </div>
            </div>
          </div>
          <div class="right-page">
            <div class="right-login animat-rate">
              <div class="animation-block">
                <div class="bg_circle">
                  <div></div>
                  <div></div>
                  <div></div>
                  <div></div>
                  <div></div>
                  <div></div>
                  <div></div>
                  <div></div>
                  <div></div>
                  <div></div>
                  <div></div>
                </div>
                <div class="cross"></div>
                <div class="cross1"></div>
                <div class="cross2"></div>
                <div class="dot"></div>
                <div class="dot1"></div>
                <div class="maincircle"></div>
                <div class="top-circle"></div>
                <div class="center-circle"></div>
                <div class="bottom-circle"></div>
                <div class="bottom-circle1"></div>
                <div class="right-circle"></div>
                <div class="right-circle1"></div><img class="heart-logo" src="assets/images/login_signup/5.png"
                  alt="login logo" /><img class="has-logo" src="assets/images/login_signup/4.png"
                  alt="login logo" /><img class="login-img" src="assets/images/login_signup/1.png"
                  alt="login logo" /><img class="boy-logo" src="assets/images/login_signup/6.png"
                  alt="login boy logo" /><img class="girl-logo" src="assets/images/login_signup/7.png"
                  alt="girllogo" /><img class="cloud-logo" src="assets/images/login_signup/2.png"
                  alt="login logo" /><img class="cloud-logo1" src="assets/images/login_signup/2.png"
                  alt="login logo" /><img class="cloud-logo2" src="assets/images/login_signup/2.png"
                  alt="login logo" /><img class="cloud-logo3" src="assets/images/login_signup/2.png"
                  alt="login logo" /><img class="cloud-logo4" src="assets/images/login_signup/2.png"
                  alt="login logo" /><img class="has-logo1" src="assets/images/login_signup/4.png" alt="login logo" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
