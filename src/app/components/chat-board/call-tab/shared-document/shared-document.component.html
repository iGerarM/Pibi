<div class="document" ngbAccordion>
  <div class="filter-block" ngbAccordionItem [collapsed]="false">
    <div class="collapse-block" ngbAccordionHeader>
      <button ngbAccordionButton>Shared Document 
        <label class="badge badge-success sm ms-2">3</label>
      </button>
      <div class="block-content" ngbAccordionCollapse>
        <div ngbAccordionBody>
          <ng-template>
            <ul class="document-list">
              <li>
                <i class="ti-folder font-danger"></i>              
                <h5>Simple_practice_project-zip</h5>
              </li>
              <li>
                <i class="ti-write font-success"></i>              
                <h5>Word_Map-jpg</h5>
              </li>
              <li>
                <i class="ti-zip font-primary"></i>
                <h5>Latest_Design_portfolio.pdf</h5>
              </li>
            </ul>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
