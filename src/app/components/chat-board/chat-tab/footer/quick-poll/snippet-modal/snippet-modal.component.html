<ng-template #codeModal let-modal>
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">
        <i class="fa fa-code"></i>code snippets
      </h2>
      <button class="close" type="button" (click)="modal.dismiss('Cross click')">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body">
      <form class="default-form">
        <h3>Create snippets</h3>
        <div class="form-group">
          <input class="form-control" type="text" placeholder="title(optional)"/>
        </div>
        <div class="form-group">
          <select class="mb-0">
            <option>ebnf</option>
            <option>c++</option>
            <option>diff</option>
            <option>dart</option>
          </select>
        </div>
        <div class="form-group">
          <textarea class="form-control" rows="5"></textarea>
        </div>
        <div class="form-group">
          <input class="form-control mb-0" type="text" placeholder="Add comment (optional)"/>
        </div>
        <div class="form-group mb-0">
          <div class="btn-snipate"><a class="btn btn-danger button-effect btn-sm me-3" (click)="modal.dismiss('Cross click')">Cancel</a>
            <a class="btn btn-primary button-effect btn-sm" (click)="modal.dismiss('Cross click')">Create & post</a>
          </div>
        </div>
      </form>
    </div>
  </div>
 <ng-template>
