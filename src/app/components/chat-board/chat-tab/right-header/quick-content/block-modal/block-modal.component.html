<ng-template #blockModal let-modal>
  <div class="modal-content">
      <div class="modal-header">
          <h5 class="modal-title"></h5>
          <button class="close" type="button" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
          </button>
      </div><div class="modal-body">
          <h3>Do you want to block this user?</h3>
          <div class="delete-btn">
              <button type="button" class="button-effect btn btn-danger btn-sm" (click)="modal.dismiss('Cross click')">Block</button>
              <button type="button" class="button-effect ms-2 btn btn-primary btn-sm" (click)="modal.dismiss('Cross click')">Close</button>
          </div>
      </div>
  </div>
</ng-template>
