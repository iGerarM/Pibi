<ng-template #addFavorite let-modal>
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Add Contact</h2>
      <button class="close" type="button" data-bs-dismiss="modal" aria-label="Close" (click)="modal.dismiss('Cross click')" >
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div class="modal-body">
      <form class="default-form">
        <div class="form-group">
          <h5>Email or Username</h5>
          <input class="form-control" id="exampleInputEmail12" type="text" placeholder="Josephin water" fdprocessedid="j24vn"/>
        </div>
        <div class="form-group">
          <h5>Contact number</h5>
          <input  class="form-control"  id="examplemsg2"  type="number"  placeholder="12345678912"  fdprocessedid="idzi3o"/>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button  class="btn btn-danger button-effect btn-sm"  type="button"  data-bs-dismiss="modal"  fdprocessedid="hpihk" (click)="modal.dismiss('Cross click')">
        Cancel
      </button>
      <button  class="btn btn-primary button-effect btn-sm" type="button" fdprocessedid="x8qdct" (click)="modal.dismiss('Cross click')"  >
        Add contact
      </button>
    </div>
  </div>
</ng-template>
