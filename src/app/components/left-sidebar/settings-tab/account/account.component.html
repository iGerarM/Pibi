<div class="block" [class.open]="isBlockOpen">
  <div class="media">
    <div class="media-body">
      <h3>Account</h3>
    </div>
    <div class="media-right">
      <a class="icon-btn btn-outline-light btn-sm pull-right previous" (click)="toggleBlock()">
        <i data-feather="chevron-left"></i>
      </a>
    </div>
  </div>
  <div class="theme-according" id="accordion">
    <div class="card">
      <app-security></app-security>
    </div>
    <div class="card">
      <app-privacy></app-privacy>
    </div>
    <div class="card">
      <app-verification></app-verification>
    </div>
    <div class="card">
      <app-change-number></app-change-number>
    </div>
    <div class="card">
      <app-account-info></app-account-info>
    </div>
    <div class="card">
      <app-delete-account></app-delete-account>
    </div>
  </div>
</div>
<div class="media">
  <div class="media-body">
    <h3>Account</h3>
    <h4>Update Your Account Details</h4>
  </div>
  <div class="media-right">
    <a class="icon-btn btn-outline-light btn-sm pull-right next" (click)="toggleBlock()">
      <i data-feather="chevron-right"></i>
    </a>
  </div>
</div>
