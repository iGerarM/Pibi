<div class="theme-tab tab-sm chat-tabs">
  <ul class="nav nav-tabs" id="myTab" role="tablist">
    @for (tab of tab; track tab;let i = $index ) {
    <li class="nav-item">
      <a class="nav-link button-effect" [class.active]="tab.active" (click)="setActiveItem(i)"
        (click)="toggleActive(tab)">
        <i [attr.data-feather]="tab.icon"></i>{{ tab.label }}
      </a>
    </li>
    }
  </ul>
  <div class="tab-content">
    @for (tab of tab; track tab) {
    <div class="tab-pane fade" [ngClass]="{'show active': tab.active}">
      @if (tab.type === 'chat') {
      <app-recent-chat></app-recent-chat>
      } @else if(tab.type === 'Call'){
      <app-call></app-call>
      } @else if(tab.type === 'Contact'){
      <app-contact></app-contact>
      }
    </div>
    }
  </div>
</div>
